<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Map – แผงผู้ดูแล</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ══ Login Screen ══════════════════════════════════════════ -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-icon" id="loginIcon">🔐</div>
    <div class="login-title" id="loginTitle">แผงผู้ดูแลระบบ</div>
    <div class="login-sub" id="loginSub">Voice Map Administration</div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label class="form-label">ชื่อผู้ใช้</label>
        <input type="text" class="form-input" id="unInput"
               placeholder="กรอกชื่อผู้ใช้" autocomplete="username" autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">รหัสผ่าน</label>
        <input type="password" class="form-input" id="pwInput"
               placeholder="กรอกรหัสผ่าน" autocomplete="current-password">
      </div>
      <div class="login-err" id="loginErr"></div>
      <button type="submit" class="btn btn-primary btn-full" id="loginSubmitBtn">
        เข้าสู่ระบบ →
      </button>
    </form>

    <div class="login-foot">
      <a class="login-foot-link" href="index.html">← กลับหน้าหลัก</a>
    </div>
  </div>
</div>

<!-- ══ Admin Layout ═══════════════════════════════════════════ -->
<div class="admin-layout" id="adminLayout">

  <!-- Sidebar -->
  <div class="admin-sidebar">

    <div class="admin-head">
      <div class="admin-head-row">
        <div>
          <h1>🗺️ Voice Map Admin</h1>
          <p>จัดการหมุดพิเศษและไฟล์เสียง</p>
        </div>
        <a class="admin-home-link" href="index.html">← หน้าหลัก</a>
      </div>
      <div class="admin-user-row">
        <span class="admin-user-badge">👤 <span id="adminUsername"></span></span>
        <button type="button" class="admin-logout-btn" id="logoutBtn">ออกจากระบบ</button>
      </div>
    </div>

    <div class="admin-toolbar">
      <button type="button" class="btn btn-primary btn-full" id="addPinBtn">+ เพิ่มหมุด</button>
    </div>

    <!-- Place search → add pin -->
    <div class="place-search-section">
      <div class="place-search-bar" id="placeSearchBar">
        <span class="place-search-icon">📍</span>
        <input type="text" class="place-search-input" id="placeSearchInput"
               placeholder="ค้นหาสถานที่เพื่อเพิ่มหมุด…" autocomplete="off">
        <button type="button" class="admin-search-clear rec-hidden"
                id="placeSearchClear" aria-label="ล้าง">✕</button>
      </div>
      <div class="place-search-results rec-hidden" id="placeSearchResults"></div>
    </div>

    <div class="add-hint" id="addHint">
      <span>🖱️ คลิกบนแผนที่เพื่อวางหมุด</span>
      <button type="button" class="add-cancel-btn" id="cancelAddBtn">ยกเลิก</button>
    </div>

    <!-- Search -->
    <div class="admin-search-wrap">
      <span class="admin-search-icon">🔍</span>
      <input type="search" class="admin-search-input" id="pinSearch"
             placeholder="ค้นหาหมุด…" autocomplete="off">
      <button type="button" class="admin-search-clear rec-hidden" id="pinSearchClear"
              aria-label="ล้างการค้นหา">✕</button>
    </div>
    <div class="admin-search-count" id="pinSearchCount"></div>

    <div class="admin-pin-list" id="pinList">
      <div class="empty-state">
        <div class="empty-state-icon">📍</div>
        <div class="empty-state-text">กำลังโหลด…</div>
      </div>
    </div>

  </div>

  <!-- Map -->
  <div class="admin-map">
    <div id="adminMap"></div>
  </div>

</div>

<!-- ══ Edit / Create Pin Modal ═══════════════════════════════ -->
<div class="modal-overlay" id="editModal">
  <div class="modal-card">

    <div class="modal-header">
      <span class="modal-title" id="modalTitle">เพิ่มหมุดใหม่</span>
      <button type="button" class="modal-close-btn" id="modalCloseBtn">✕</button>
    </div>

    <div class="form-group">
      <label class="form-label">ชื่อสถานที่ <span class="required-star">*</span></label>
      <input type="text" class="form-input" id="pinName" placeholder="เช่น วัดพระแก้ว, ตลาดนัด…">
    </div>

    <div class="form-group">
      <label class="form-label">คำอธิบาย</label>
      <textarea class="form-input" id="pinDesc" rows="3" placeholder="คำอธิบายสถานที่ (ไม่บังคับ)"></textarea>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label class="form-label">ละติจูด</label>
        <input type="number" class="form-input" id="pinLat" step="0.000001" placeholder="13.756331">
      </div>
      <div class="form-group">
        <label class="form-label">ลองจิจูด</label>
        <input type="number" class="form-input" id="pinLng" step="0.000001" placeholder="100.501762">
      </div>
    </div>

    <div class="divider"></div>

    <div class="form-group">
      <label class="form-label rec-audio-label">🎙️ ไฟล์เสียงประจำหมุด (สูงสุด 60 วินาที)</label>

      <div class="recorder-box">
        <div class="rec-timer rec-hidden" id="recTimer">00:00</div>

        <div class="waveform rec-hidden" id="recWave">
          <div class="wv-bar"></div>
          <div class="wv-bar"></div>
          <div class="wv-bar"></div>
          <div class="wv-bar"></div>
          <div class="wv-bar"></div>
          <div class="wv-bar"></div>
          <div class="wv-bar"></div>
          <div class="wv-bar"></div>
        </div>

        <div class="rec-status" id="recStatus">ยังไม่มีไฟล์เสียง</div>

        <div class="rec-controls">
          <button type="button" class="rec-btn rec-start" id="recBtn" title="เริ่มอัดเสียง">🎙️</button>
          <button type="button" class="rec-btn rec-play rec-hidden" id="recPlayBtn" title="ฟังเสียง">▶️</button>
          <button type="button" class="rec-btn rec-del rec-hidden" id="recDelBtn" title="ลบเสียง">🗑️</button>
        </div>
      </div>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn btn-outline modal-action-btn" id="cancelBtn">ยกเลิก</button>
      <button type="button" class="btn btn-primary modal-action-btn" id="saveBtn">💾 บันทึกหมุด</button>
    </div>

  </div>
</div>

<!-- ══ Toast ══════════════════════════════════════════════════ -->
<div class="toast" id="adminToast"></div>

<!-- ══ Scripts ══════════════════════════════════════════════ -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/db.js"></script>
<script src="js/audio-manager.js"></script>
<script src="js/admin.js"></script>

</body>
</html>
